baseURL = 'https://atsip-conference.github.io/'
languageCode = 'en-us'
title = 'ATSIP'
enableRobotsTXT = true

# Pas de taxonomies sur ce site : sans cela Hugo publie /categories/ et /tags/,
# deux pages vides qui diluent l'indexation.
disableKinds = ['taxonomy', 'term']

[params]
  fullName = 'International Conference on Advanced Technologies for Signal and Image Processing'
  acronym = 'ATSIP'
  contactEmail = 'atsip.conf@gmail.com'
  dblp = 'https://dblp.org/db/conf/atsip/index.html'

  # Usage de la marque IEEE sur le site. IEEE a demande le 28 octobre 2026 de
  # retirer ses logos tant que le MOU n'est pas approuve : sa marque ne peut
  # etre affichee avant la signature du protocole de sponsorisation.
  # Repasser a true une fois le MOU approuve, et rien d'autre a toucher.
  ieeeBranding = false

  # Jeton de verification Google Search Console.
  # Coller ici UNIQUEMENT la valeur de content="..." de la balise fournie par
  # Google, sans les guillemets ni le reste de la balise. Exemple :
  #   googleVerification = 'AbCdEf123456_gHiJkLmNoPqRsTuVwXyZ'
  googleVerification = ''

[markup.goldmark.renderer]
  unsafe = true
