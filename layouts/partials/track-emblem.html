{{/* Emblème d'un track, dessiné en SVG : un par thématique, dans l'ordre de
     content/_index.md. Monoligne, deux couleurs, hérite de la couleur du
     texte ; l'accent ambre marque l'élément actif de chaque figure.
     Paramètre : l'indice du track (1 à 8). */}}
{{ $i := . }}
<svg class="track__emblem" viewBox="0 0 96 64" aria-hidden="true" focusable="false">
  <g fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">

  {{ if eq $i 1 }}
    {{/* Imagerie médicale : coupe crânienne et courbes de niveau, repère de diagnostic. */}}
    <path d="M30 54V40c-6-3-9-9-9-16 0-13 11-21 24-21 14 0 24 9 24 22 0 7-3 12-8 15v14"/>
    <path d="M36 44c-4-3-6-8-6-14 0-9 7-15 16-15 8 0 15 6 15 15 0 6-3 11-7 14"/>
    <path d="M44 40c-3-2-5-5-5-9 0-5 4-9 9-9"/>
    <circle class="em-accent" cx="57" cy="29" r="5"/>
    <path class="em-accent" d="M57 20v-5M57 43v-5M48 29h-5M71 29h-5"/>
  {{ end }}

  {{ if eq $i 2 }}
    {{/* Systèmes embarqués : puce, broches et liaison vers le capteur. */}}
    <rect x="30" y="18" width="36" height="28" rx="2"/>
    <rect x="40" y="28" width="16" height="8" rx="1"/>
    <path d="M30 25h-9M30 32h-9M30 39h-9M66 25h9M66 32h9M66 39h9"/>
    <path d="M38 18v-8M48 18v-8M58 18v-8M38 46v8M48 46v8M58 46v8"/>
    <circle class="em-accent" cx="48" cy="32" r="2.4" fill="currentColor" stroke="none"/>
  {{ end }}

  {{ if eq $i 3 }}
    {{/* Télédétection : orbite, fauchée au sol et relief observé. */}}
    <path d="M8 18c16-9 36-13 52-9 10 3 20 8 28 15"/>
    <path d="M6 52h84"/>
    <path d="M14 52c6-8 12-13 18-13s10 6 16 6 10-9 18-9 12 7 20 16"/>
    <rect class="em-accent" x="42" y="8" width="12" height="9" rx="1.5"/>
    <path class="em-accent" d="M42 12h-8M54 12h8"/>
    <path class="em-accent" d="M45 19l-9 25M51 19l9 25" stroke-dasharray="3 3"/>
  {{ end }}

  {{ if eq $i 4 }}
    {{/* Communications : deux nœuds et propagation entre eux. */}}
    <circle cx="20" cy="32" r="5"/>
    <circle cx="76" cy="32" r="5"/>
    <path d="M28 24c4 4 6 8 6 8s-2 4-6 8"/>
    <path d="M34 18c6 6 9 12 9 14s-3 8-9 14"/>
    <path class="em-accent" d="M68 24c-4 4-6 8-6 8s2 4 6 8"/>
    <path class="em-accent" d="M62 18c-6 6-9 12-9 14s3 8 9 14"/>
    <path d="M20 37v12M76 37v12" stroke-dasharray="3 3"/>
  {{ end }}

  {{ if eq $i 5 }}
    {{/* Signal et image : une onde qui devient grille de pixels. */}}
    <path d="M6 32c4 0 4-16 8-16s4 32 8 32 4-24 8-24 4 16 8 16 4-10 8-10"/>
    <path d="M46 30h4"/>
    <rect x="56" y="14" width="34" height="34" rx="2"/>
    <path d="M67 14v34M79 14v34M56 25h34M56 36h34"/>
    <rect class="em-accent" x="67" y="25" width="12" height="11" fill="currentColor" stroke="none" opacity="0.55"/>
  {{ end }}

  {{ if eq $i 6 }}
    {{/* Données massives : strates de stockage et flux vers le calcul. */}}
    <ellipse cx="34" cy="16" rx="18" ry="6"/>
    <path d="M16 16v12c0 3.3 8 6 18 6s18-2.7 18-6V16"/>
    <path d="M16 28v12c0 3.3 8 6 18 6s18-2.7 18-6V28"/>
    <path class="em-accent" d="M56 26h10M56 38h10" stroke-dasharray="3 3"/>
    <rect class="em-accent" x="70" y="20" width="20" height="24" rx="2"/>
    <path class="em-accent" d="M75 28h10M75 34h10"/>
  {{ end }}

  {{ if eq $i 7 }}
    {{/* Intelligence artificielle : un réseau à trois couches. */}}
    <path d="M26 18l22 7M26 32h22M26 46l22-7M48 25l22-7M48 25v14M48 39l22 7M48 25l22 14M48 39l22-14" opacity="0.55"/>
    <circle cx="22" cy="18" r="4"/><circle cx="22" cy="32" r="4"/><circle cx="22" cy="46" r="4"/>
    <circle class="em-accent" cx="48" cy="25" r="4.5"/>
    <circle class="em-accent" cx="48" cy="39" r="4.5"/>
    <circle cx="74" cy="18" r="4"/><circle cx="74" cy="46" r="4"/>
  {{ end }}

  {{ if eq $i 8 }}
    {{/* Sécurité : scellement d'une trame de données. */}}
    <path d="M10 20h22M10 32h16M10 44h22"/>
    <path d="M14 14v36" stroke-dasharray="3 3"/>
    <rect x="42" y="30" width="30" height="22" rx="2"/>
    <path d="M48 30v-7a9 9 0 0 1 18 0v7"/>
    <circle class="em-accent" cx="57" cy="39" r="3"/>
    <path class="em-accent" d="M57 42v5"/>
    <path d="M78 24h8M78 32h8M78 40h8" opacity="0.5"/>
  {{ end }}

  </g>
</svg>
